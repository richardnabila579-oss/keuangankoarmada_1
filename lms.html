<style>
/* VOICE: tegas, rapi, seperti buku panduan latihan satuan; tenang tetapi berwibawa.
   IDEA: peta haluan pelayaran: enam sesi adalah enam titik singgah dalam satu siklus anggaran.
   PICTURE: animasi siklus anggaran dengan penanda kapal yang berlayar dari tahap ke tahap.
   COLOUR and TYPE: biru laut tua dominan, putih kertas peta, merah bendera sebagai aksen; Barlow Condensed + Barlow.
   LAYOUT: pita kepala biru penuh, animasi besar di layar pertama, kartu sesi seperti log pelayaran di bawahnya. */
:root{color-scheme:light dark;
--bg:light-dark(#f4f6f9,#0a1522);--paper:light-dark(#ffffff,#111f30);--ink:light-dark(#0f1b2b,#e8eef6);--quiet:light-dark(#53627a,#9db0c7);
--navy:#0d2a4a;--navy2:light-dark(#163d66,#1d4a78);--sea:light-dark(#2f6f9f,#6aa8d8);--red:light-dark(#c8102e,#ff5a6e);--line:light-dark(#d8dfe8,#24384f);
--ok:light-dark(#1d7a46,#5fd18f);--warn:light-dark(#9a5b00,#f2b450);--tint:light-dark(#e9f0f7,#16283d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;line-height:1.05;text-wrap:balance;margin:0 0 .4em}
h1{font-size:clamp(32px,5vw,50px)}h2{font-size:clamp(26px,3.4vw,36px)}h3{font-size:22px}
a{color:var(--sea)}
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
.top .in{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px max(5vw,16px);max-width:1320px;margin:auto}
.brand{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;font-size:21px;letter-spacing:.2px;margin-right:auto;color:#fff;text-decoration:none}
.brand small{display:block;font:500 12px Barlow,system-ui,sans-serif;opacity:.75}
nav.scroll{display:flex;gap:4px;overflow-x:auto;max-width:100%}
nav a{color:#dbe7f5;text-decoration:none;padding:10px 12px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap;min-height:44px;display:flex;align-items:center}
nav a:hover{background:#ffffff1a}nav a.on{background:#fff;color:var(--navy)}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;background:#ffffff22;color:#fff;white-space:nowrap}
.band{padding:clamp(28px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1240px;margin:auto}
.hero{background:var(--navy);color:#fff;padding-top:clamp(20px,3vw,36px)}
.hero p.lead{color:#c9d8ea;max-width:62ch;font-size:17px}
.heroGrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:center}
.fig{position:relative;aspect-ratio:16/10;background:linear-gradient(#103459,#0b2443);border-radius:16px;border:1px solid #ffffff1f}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.cap{background:#ffffff12;border:1px solid #ffffff22;border-radius:14px;padding:20px}
.cap .k{font-size:13px;color:#9fc0e3}.cap h3{font-size:28px;margin:.2em 0 .3em}
.cap dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:12px 0 16px}.cap dt{color:#9fc0e3;font-size:14px}.cap dd{margin:0}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:600 15px Barlow,system-ui,sans-serif;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
button.pri,.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.hero button{background:#ffffff14;border-color:#ffffff40;color:#fff}.hero button.pri{background:var(--red);border-color:var(--red)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #6aa8d8;outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px}
.muted{color:var(--quiet)}.small{font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input,select{font:16px Barlow,system-ui,sans-serif;width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.route{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:14px}
.leg{display:block;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative}
.leg:hover{border-color:var(--sea)}.leg .n{font:700 34px "Barlow Condensed";color:var(--sea)}.leg b{display:block;font-size:17px;line-height:1.25}
.st{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--tint);color:var(--quiet)}
.st.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.st.no{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}
.bar{height:10px;border-radius:99px;background:var(--tint);overflow:hidden}.bar i{display:block;height:100%;background:var(--sea);border-radius:99px;transition:width .6s}
.sesHead{background:var(--navy);color:#fff}.sesHead .muted{color:#b9cbe0}
.pts{padding-left:1.2em}.pts li{margin:6px 0}
.flow{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.step{flex:1 1 150px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper);transition:all .35s;position:relative}
.step .w{font-size:13px;color:var(--quiet)}.step b{display:block;font-size:16px}
.step.on{border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 22%,transparent);transform:translateY(-3px)}
.step.done{border-color:var(--sea)}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px;background:var(--paper)}
legend{font-weight:600;padding:0 6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:8px;cursor:pointer;font-weight:400;font-size:16px;margin:2px 0}
.opt input{width:20px;min-height:20px;margin-top:3px;flex:none}.opt:hover{background:var(--tint)}
.opt.right{background:color-mix(in srgb,var(--ok) 14%,transparent)}.opt.wrong{background:color-mix(in srgb,var(--red) 12%,transparent)}
.expl{font-size:14px;color:var(--quiet);margin:6px 8px 0}
.score{font:700 44px "Barlow Condensed"}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--quiet);font-weight:600}td.num,th.num{text-align:right;white-space:nowrap}
.order li{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 8px 6px 14px;margin:6px 0}
.order li span{flex:1}.order button{min-height:40px;padding:0 12px}
.order{list-style:none;padding:0;counter-reset:o}.order li::before{counter-increment:o;content:counter(o);font:700 20px "Barlow Condensed";color:var(--sea);width:20px}
.note{background:var(--tint);border-radius:12px;padding:12px 16px;font-size:15px}
.req li{margin:6px 0;list-style:none}.req{padding:0}
.req li::before{content:"✕";color:var(--red);font-weight:700;margin-right:8px}.req li.ok::before{content:"✓";color:var(--ok)}
.cert img{width:100%;border-radius:10px;border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.stats .card b{font:700 40px "Barlow Condensed";display:block}
.hbars div{display:grid;grid-template-columns:70px minmax(0,1fr) 44px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
pre,.scroll{overflow-x:auto}
footer{padding:24px max(5vw,16px);color:var(--quiet);font-size:13px;text-align:center}
@media(max-width:860px){.heroGrid,.grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--quiet)}.stack td:empty{display:none}.brand small{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.scroll>a{flex-shrink:0}.blogo{height:38px;width:auto;float:left;margin:2px 10px 0 0}.sx{display:flex;gap:6px;flex-wrap:wrap}.sx a{font:600 14px Barlow,sans-serif;color:#fff;text-decoration:none;padding:8px 14px;border-radius:99px;border:2px solid #ffffff66;min-height:40px;display:inline-flex;align-items:center}.sx a:hover,.sx a[aria-current]{background:#fff;color:#0d2a4a;border-color:#fff}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>

const use=n=>{try{return Promise.resolve(window.claude?.use?.(n)??null).catch(()=>null).then(v=>v??(n==='downloads'?DLF:null))}catch(e){return Promise.resolve(n==='downloads'?DLF:null)}};

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const KEY='lms-koarmada1-v1';

try{const x=JSON.parse(localStorage.getItem(KEY));if(x)S=Object.assign(S,x)}catch(e){}
let db=null,user=null,uid=null,canWrite=false,isInstr=false,writing=false,pending=false,saveT=null;
const best=(a,b)=>Math.max(a||0,b||0);
function merge(r){if(!r)return;S.profil.nama||=r.profil?.nama||'';S.profil.nrp||=r.profil?.nrp||'';S.profil.satuan||=r.profil?.satuan||'';
for(const k in r.kuis||{})S.kuis[k]=best(S.kuis[k],r.kuis[k]);for(const k in r.sim||{})S.sim[k]=best(S.sim[k],r.sim[k]);if(r.akhir!=null)S.akhir=best(S.akhir,r.akhir)}
function setSync(t){$('#sync').textContent=t}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
if(!(db&&uid&&canWrite))return;clearTimeout(saveT);saveT=setTimeout(push,800)}
async function push(){if(writing){pending=true;return}writing=true;setSync('Menyimpan…');
try{await db.doc('progress/'+uid).set({uid,profil:S.profil,kuis:S.kuis,sim:S.sim,akhir:S.akhir,rata:avg(),lulus:certOK().ok,updatedAt:Date.now()});setSync('Tersimpan & tersinkron')}
catch(e){if(e&&e.code==='invalid_argument'){canWrite=false;setSync('Tersimpan di perangkat ini')}else setSync('Gagal sinkron, tersimpan lokal')}
writing=false;if(pending){pending=false;push()}}

function avg(){const v=[1,2,3,4,5,6].map(n=>S.kuis[n]||0);v.push(S.akhir||0);return Math.round(v.reduce((a,b)=>a+b,0)/v.length)}
function certOK(){const r=[
{t:'Isi nama, pangkat/NRP, dan satuan di Beranda',ok:!!(S.profil.nama&&S.profil.nrp&&S.profil.satuan)},
{t:'Lulus kuis keenam sesi (nilai ≥ 70)',ok:[1,2,3,4,5,6].every(n=>(S.kuis[n]||0)>=70)},
{t:'Menyelesaikan tiga simulasi kasus (nilai ≥ 70)',ok:Object.keys(SIMS).every(k=>(S.sim[k]||0)>=70)},
{t:'Lulus evaluasi akhir (nilai ≥ 70)',ok:(S.akhir||0)>=70},
{t:'Rata-rata kuis sesi dan evaluasi akhir ≥ 75 (saat ini '+avg()+')',ok:avg()>=75}];return{r,ok:r.every(x=>x.ok)}}

let timers=[];const clearTimers=()=>{timers.forEach(t=>{clearInterval(t);cancelAnimationFrame(t)});timers=[]};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

$('#nav').innerHTML=items.map(([k,l])=>`<a href="#${k}" class="${h===k?'on':''}">${l}</a>`).join('')}
function status(n){const v=S.kuis[n];return v==null?'<span class="st">Belum dikerjakan</span>':v>=70?`<span class="st ok">Lulus · ${v}</span>`:`<span class="st no">Belum lulus · ${v}</span>`}

/* ---------- Animasi siklus ---------- */
function siklusHTML(){return `<div class="heroGrid"><div class="fig" id="fig"><svg id="cyc" viewBox="0 0 640 400" role="img" aria-label="Animasi siklus anggaran enam tahap"></svg></div>
<div class="cap" aria-live="polite"><div class="k" id="capK"></div><h3 id="capT"></h3><dl><dt>Waktu</dt><dd id="capW"></dd><dt>Pelaksana</dt><dd id="capP"></dd><dt>Dokumen</dt><dd id="capD"></dd></dl>
<div class="ctrl"><button data-act="cprev" aria-label="Tahap sebelumnya">◀ Sebelumnya</button><button class="pri" data-act="cplay" id="cplay">Jeda</button><button data-act="cnext" aria-label="Tahap berikutnya">Berikutnya ▶</button></div></div></div>`}
const CX=320,CY=205,RX=190,RY=135,ang=i=>-Math.PI/2+i*Math.PI/3;
const pos=a=>[CX+RX*Math.cos(a),CY+RY*Math.sin(a)];
const SHORT=['Perencanaan','RKA & DIPA','Pelaksanaan','Penatausahaan','Rekonsiliasi','Laporan'];
let cyc={i:0,a:ang(0),play:!reduce,hold:0};
function drawCyc(){const s=$('#cyc');if(!s)return;const [sx,sy]=pos(cyc.a);let o=`<defs><radialGradient id="glow"><stop offset="0" stop-color="#ff5a6e" stop-opacity=".55"/><stop offset="1" stop-color="#ff5a6e" stop-opacity="0"/></radialGradient></defs>`;
o+=`<ellipse cx="${CX}" cy="${CY}" rx="${RX}" ry="${RY}" fill="none" stroke="#6aa8d8" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 8"/>`;
for(let k=1;k<5;k++)o+=`<path d="M${40+k*30} ${360+k*6} q40 -10 80 0 t80 0 t80 0" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="2"/>`;
o+=`<text x="${CX}" y="${CY-8}" text-anchor="middle" fill="#fff" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="30">Siklus Anggaran</text><text x="${CX}" y="${CY+20}" text-anchor="middle" fill="#9fc0e3" font-size="15" font-family="Barlow,system-ui,sans-serif">Koarmada I · T-2 sampai T+1</text>`;
STAGES.forEach((g,i)=>{const [x,y]=pos(ang(i)),on=i===cyc.i,lx=x+(Math.cos(ang(i))>.2?38:Math.cos(ang(i))<-.2?-38:0),ly=y+(Math.abs(Math.cos(ang(i)))<=.2?(Math.sin(ang(i))<0?-38:48):6),an=Math.cos(ang(i))>.2?'start':Math.cos(ang(i))<-.2?'end':'middle';
o+=`<g data-act="cgo" data-i="${i}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="26" fill="${on?'#c8102e':'#0d2a4a'}" stroke="${on?'#ff8a98':'#6aa8d8'}" stroke-width="2"/><text x="${x}" y="${y+8}" text-anchor="middle" fill="#fff" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="24">${i+1}</text>
<text x="${lx}" y="${ly}" text-anchor="${an}" fill="${on?'#fff':'#c9d8ea'}" font-family="Barlow,system-ui,sans-serif" font-weight="${on?600:500}" font-size="17">${SHORT[i]}</text></g>`});
o+=`<circle cx="${sx}" cy="${sy}" r="40" fill="url(#glow)"/><g transform="translate(${sx},${sy})"><path d="M-14 4 L14 4 L9 12 L-9 12 Z" fill="#fff"/><path d="M-2 4 V-14 L10 2 Z" fill="#ffd9de"/></g>`;s.innerHTML=o;
const g=STAGES[cyc.i];$('#capK').textContent='Tahap '+(cyc.i+1)+' dari 6';$('#capT').textContent=g.t;$('#capW').textContent=g.w;$('#capP').textContent=g.p;$('#capD').textContent=g.d;$('#cplay').textContent=cyc.play?'Jeda':'Putar'}
function goCyc(i){const from=cyc.a;let to=ang(i);if(i===0&&cyc.i===5)to=ang(6);if(i<cyc.i&&!(i===0&&cyc.i===5))to=ang(i);cyc.i=i;
if(reduce){cyc.a=ang(i);drawCyc();return}const t0=performance.now(),dur=1100;const step=t=>{const p=Math.min(1,(t-t0)/dur),e=p<.5?2*p*p:1-(-2*p+2)**2/2;cyc.a=from+(to-from)*e;drawCyc();if(p<1)timers.push(requestAnimationFrame(step));else{cyc.a=ang(i)}};timers.push(requestAnimationFrame(step))}
function startCyc(){drawCyc();timers.push(setInterval(()=>{if(cyc.play)goCyc((cyc.i+1)%6)},4200))}

/* ---------- Animasi alur ---------- */
function flowHTML(id,steps,title){return `<div class="card"><h3>${title}</h3><div class="flow" id="${id}">${steps.map((s,i)=>`<div class="step" data-i="${i}"><div class="w">${i+1} · ${s.w}</div><b>${s.b}</b><div class="small muted">${s.d}</div></div>`).join('')}</div>
<div class="bar"><i id="${id}-bar" style="width:0"></i></div><div class="ctrl" style="margin-top:12px"><button data-act="fplay" data-f="${id}">Jeda</button><button data-act="freset" data-f="${id}">Ulangi</button></div></div>`}
const flows={};
function startFlow(id,n){flows[id]={i:0,play:!reduce,n};const paint=()=>{const f=flows[id],el=document.getElementById(id);if(!el)return;el.querySelectorAll('.step').forEach((s,k)=>{s.classList.toggle('on',k===f.i);s.classList.toggle('done',k<f.i)});document.getElementById(id+'-bar').style.width=((f.i+1)/n*100)+'%';const b=document.querySelector(`[data-act=fplay][data-f=${id}]`);if(b)b.textContent=f.play?'Jeda':'Putar'};flows[id].paint=paint;paint();
timers.push(setInterval(()=>{const f=flows[id];if(f.play){f.i=(f.i+1)%n;paint()}},2300))}

/* ---------- Kuis ---------- */
function quizHTML(id,qs,done){return `<form data-quiz="${id}">${qs.map((q,i)=>`<fieldset><legend>${i+1}. ${esc(q[0])}</legend>${q[1].map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" required> <span>${esc(o)}</span></label>`).join('')}</fieldset>`).join('')}
<div class="ctrl"><button class="pri" type="submit">Kirim jawaban</button></div><div id="${id}-res" aria-live="polite"></div></form>`}
function gradeQuiz(form,qs){let ok=0;qs.forEach((q,i)=>{const sel=form.querySelector(`input[name=q${i}]:checked`),v=sel?+sel.value:-1;if(v===q[2])ok++;
form.querySelectorAll(`input[name=q${i}]`).forEach(inp=>{const l=inp.closest('.opt');l.classList.toggle('right',+inp.value===q[2]);l.classList.toggle('wrong',+inp.value===v&&v!==q[2])});
const fs=form.querySelectorAll('fieldset')[i];fs.querySelector('.expl')?.remove();fs.insertAdjacentHTML('beforeend',`<div class="expl">${v===q[2]?'Benar. ':'Kurang tepat. '}${esc(q[3])}</div>`)});return Math.round(ok/qs.length*100)}

function simHTML(k){
if(k==='cocok'){const opts=shuffle(COCOK.map(c=>c[1]));return `<div class="card"><h3>Simulasi: ${SIMS.cocok}</h3><p class="muted small">Pilih pejabat yang tepat untuk setiap tugas.</p><table class="stack"><thead><tr><th>Tugas</th><th>Pejabat</th></tr></thead><tbody>${COCOK.map((c,i)=>`<tr><td>${c[0]}</td><td><select data-c="${i}" aria-label="Pejabat untuk ${c[0]}"><option value="">Pilih…</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>

if(k==='urut'){simState.urut=simState.urut||shuffle(URUT);return `<div class="card"><h3>Simulasi: ${SIMS.urut}</h3><p class="muted small">Bagian A: susun urutan alur pembayaran dengan tombol naik/turun. Bagian B: pilih mekanisme pembayaran.</p>
<ol class="order" id="ord">${simState.urut.map((t,i)=>`<li><span>${t}</span><button data-act="up" data-i="${i}" aria-label="Naikkan ${t}">▲</button><button data-act="dn" data-i="${i}" aria-label="Turunkan ${t}">▼</button></li>`).join('')}</ol>
<table class="stack"><thead><tr><th>Kebutuhan belanja</th><th>Mekanisme</th></tr></thead><tbody>${MEK.map((m,i)=>`<tr><td>${m[0]}</td><td><select data-m="${i}" aria-label="Mekanisme untuk ${m[0]}"><option value="">Pilih…</option>${['LS','UP','GU','TUP'].map(o=>`<option>${o}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>
<div class="ctrl" style="margin-top:12px"><button class="pri" data-act="simcek" data-k="urut">Periksa</button></div><div id="sim-urut" aria-live="polite"></div></div>`}
if(k==='rekon'){return `<div class="card"><h3>Simulasi: ${SIMS.rekon}</h3><p class="muted small">Data rekonsiliasi bulan Mei sebuah satker (dalam juta rupiah, data latihan). Tentukan penyebab setiap baris.</p><div class="scroll"><table><thead><tr><th>Akun</th><th class="num">SAKTI</th><th class="num">KPPN</th><th class="num">Selisih</th><th>Penyebab</th></tr></thead><tbody>
${REKON.map((r,i)=>`<tr><td>${r[0]}</td><td class="num">${fmt(r[1])}</td><td class="num">${fmt(r[2])}</td><td class="num">${fmt(r[1]-r[2])}</td><td><select data-r="${i}" aria-label="Penyebab ${r[0]}" style="min-width:220px"><option value="">Pilih…</option>${SEBAB.map(o=>`<option>${o}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>
<p class="small muted">Petunjuk: total belanja pemeliharaan dan modal sama di kedua sisi, tetapi pembagiannya berbeda.</p>
<div class="ctrl"><button class="pri" data-act="simcek" data-k="rekon">Periksa</button></div><div id="sim-rekon" aria-live="polite"></div></div>`}}
function simCheck(k){let sc=0,msg='';
if(k==='cocok'){let ok=0;document.querySelectorAll('[data-c]').forEach(s=>{const r=s.value===COCOK[+s.dataset.c][1];if(r)ok++;s.style.borderColor=s.value?(r?'var(--ok)':'var(--red)'):''});sc=Math.round(ok/COCOK.length*100);msg=`${ok} dari ${COCOK.length} benar.`}
if(k==='urut'){let a=0;simState.urut.forEach((t,i)=>{if(t===URUT[i])a++});let b=0;document.querySelectorAll('[data-m]').forEach(s=>{const r=s.value===MEK[+s.dataset.m][1];if(r)b++;s.style.borderColor=s.value?(r?'var(--ok)':'var(--red)'):''});sc=a*10+b*10;msg=`Urutan: ${a} dari 5 posisi tepat. Mekanisme: ${b} dari 5 tepat.${a<5?' Ingat: perikatan → BAST → SPP → SPM → SP2D.':''}`}
if(k==='rekon'){let ok=0;document.querySelectorAll('[data-r]').forEach(s=>{const r=s.value===REKON[+s.dataset.r][3];if(r)ok++;s.style.borderColor=s.value?(r?'var(--ok)':'var(--red)'):''});sc=Math.round(ok/REKON.length*100);msg=`${ok} dari ${REKON.length} benar.${ok<5?' Selisih Rp25 juta pada belanja barang adalah SP2D tanggal 31 Mei yang belum direkam.':' Setelah koreksi, hasil rekonsiliasi KPPN dapat diterbitkan.'}`}
S.sim[k]=best(S.sim[k],sc);save();document.getElementById('sim-'+k).innerHTML=`<p><span class="score">${sc}</span> <span class="muted">/ 100 · terbaik ${S.sim[k]}</span></p><p>${msg}</p>`}

<div>${s.anim==='siklus'?`<div class="card hero" style="margin-top:24px;border:0"><h3>Animasi siklus anggaran</h3>${siklusHTML()}</div>`:s.anim==='bayar'?flowHTML('fb',FLOW_BAYAR,'Animasi alur pembayaran'):s.anim==='rekon'?flowHTML('fr',FLOW_REKON,'Animasi menuju laporan terekonsiliasi'):`<div class="card"><h3>Ingat posisi sesi ini</h3><p>Sesi ini berada pada tahap <b>${n===2?'1–2: Perencanaan, RKA dan DIPA':n===4?'4: Penatausahaan bulanan':'6: Laporan dan pengawasan'}</b> dalam siklus anggaran. Lihat animasi lengkap di <a href="#beranda">Beranda</a>.</p></div>`}</div></div>
${s.sim?`<div class="wrap" style="margin-top:24px">${simHTML(s.sim)}</div>`:''}
<div class="wrap" style="margin-top:24px"><h2>Kuis Sesi ${n}</h2><p class="muted">Lulus dengan nilai minimal 70. Nilai terbaik yang disimpan.</p>${quizHTML('k'+n,s.q)}</div>
<div class="wrap ctrl" style="margin-top:20px">${n>1?`<a class="btn" href="#sesi-${n-1}" style="display:inline-flex;align-items:center;text-decoration:none">◀ Sesi ${n-1}</a>`:''}${n<6?`<a class="btn pri" href="#sesi-${n+1}" style="display:inline-flex;align-items:center;text-decoration:none">Sesi ${n+1} ▶</a>`:`<a class="btn pri" href="#evaluasi" style="display:inline-flex;align-items:center;text-decoration:none">Evaluasi akhir ▶</a>`}</div></section>`}
let finalQs=null;
function vEvaluasi(){const ready=[1,2,3,4,5,6].every(n=>(S.kuis[n]||0)>=70);finalQs=finalQs||SES.flatMap(s=>shuffle(s.q).slice(0,2));
return `<section class="band sesHead"><div class="wrap"><h1>Evaluasi akhir</h1><p class="muted">12 soal dari keenam sesi. Nilai terbaik: ${S.akhir==null?'belum ada':S.akhir}</p></div></section><section class="band"><div class="wrap">
${ready?quizHTML('fin',finalQs)+'<div class="ctrl" style="margin-top:10px"><button data-act="newfin">Acak soal baru</button></div>':`<div class="note">Evaluasi akhir terbuka setelah keenam kuis sesi lulus. Sesi yang belum lulus: ${[1,2,3,4,5,6].filter(n=>(S.kuis[n]||0)<70).map(n=>`<a href="#sesi-${n}">Sesi ${n}</a>`).join(', ')}.</div>`}</div></section>`}
function vSertifikat(){const c=certOK();return `<section class="band sesHead"><div class="wrap"><h1>Sertifikat kelulusan</h1><p class="muted">Sertifikat terbuka setelah semua syarat terpenuhi.</p></div></section><section class="band"><div class="wrap grid2">
<div class="card"><h2>Syarat</h2><ul class="req">${c.r.map(x=>`<li class="${x.ok?'ok':''}">${x.t}</li>`).join('')}</ul></div>
<div class="card cert">${c.ok?`<img id="certImg" alt="Sertifikat kelulusan atas nama ${esc(S.profil.nama)}"><div class="ctrl" style="margin-top:12px"><button class="pri" data-act="dl" id="dlBtn">Unduh sertifikat (PNG)</button></div><p class="small muted" id="dlMsg">Tanda tangan pejabat dibubuhkan setelah dicetak.</p>`:'<p class="muted">Lengkapi syarat di samping untuk membuka sertifikat.</p>'}</div></div></section>`}
function drawCert(){const cv=document.createElement('canvas');cv.width=1600;cv.height=1130;const x=cv.getContext('2d');
x.fillStyle='#fff';x.fillRect(0,0,1600,1130);x.strokeStyle='#0d2a4a';x.lineWidth=14;x.strokeRect(30,30,1540,1070);x.strokeStyle='#c8102e';x.lineWidth=3;x.strokeRect(58,58,1484,1014);
x.fillStyle='#0d2a4a';x.fillRect(58,58,1484,150);x.textAlign='center';x.fillStyle='#fff';x.font='700 30px "Barlow Condensed",sans-serif';x.fillText('KOMANDO ARMADA I · KEUANGAN WILAYAH KOARMADA I',800,120);x.font='500 24px Barlow,sans-serif';x.fillText('Pelatihan Penganggaran bagi Personel Baru Pengelola Keuangan',800,165);
x.fillStyle='#0d2a4a';x.font='700 92px "Barlow Condensed",sans-serif';x.fillText('SERTIFIKAT',800,330);x.fillStyle='#53627a';x.font='400 28px Barlow,sans-serif';x.fillText('diberikan kepada',800,395);
x.fillStyle='#0f1b2b';x.font='700 66px "Barlow Condensed",sans-serif';x.fillText(S.profil.nama.slice(0,48),800,485);x.fillStyle='#c8102e';x.fillRect(500,510,600,3);
x.fillStyle='#0f1b2b';x.font='500 28px Barlow,sans-serif';x.fillText(`${S.profil.nrp.slice(0,60)} · ${S.profil.satuan.slice(0,60)}`,800,565);
x.fillStyle='#53627a';x.font='400 27px Barlow,sans-serif';x.fillText('telah menyelesaikan 6 sesi pelatihan (12 JP), 3 simulasi kasus, dan evaluasi akhir',800,630);x.fillText('tentang alur penganggaran dari perencanaan sampai laporan keuangan terekonsiliasi',800,670);
x.fillStyle='#0d2a4a';x.font='700 44px "Barlow Condensed",sans-serif';x.fillText(`Nilai rata-rata ${avg()}`,800,750);
const tgl=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});x.font='400 24px Barlow,sans-serif';x.fillStyle='#53627a';x.fillText(tgl,800,795);
x.font='600 26px Barlow,sans-serif';x.fillStyle='#0f1b2b';[[440,'Instruktur'],[1160,'Kakuwil Koarmada I']].forEach(([cx,t])=>{x.fillText(t,cx,870);x.strokeStyle='#0f1b2b';x.lineWidth=2;x.beginPath();x.moveTo(cx-180,990);x.lineTo(cx+180,990);x.stroke();x.font='400 20px Barlow,sans-serif';x.fillStyle='#53627a';x.fillText('nama, pangkat, NRP',cx,1020);x.font='600 26px Barlow,sans-serif';x.fillStyle='#0f1b2b'});
return cv}
let rows=[],unsub=null,profs={};
function vInstruktur(){if(!isInstr)return `<section class="band"><div class="wrap note">Halaman ini hanya untuk instruktur (pemilik atau editor LMS).</div></section>`;
const n=rows.length,lulus=rows.filter(r=>r.lulus).length,per=[1,2,3,4,5,6].map(k=>{const v=rows.map(r=>r.kuis?.[k]).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0});
const low=n?per.indexOf(Math.min(...per))+1:null;
return `<section class="band sesHead"><div class="wrap"><h1>Dasbor instruktur</h1><p class="muted">${n?`Sesi dengan rata-rata terendah: <b style="color:#fff">Sesi ${low} (${per[low-1]})</b>. Ulas materi ini pada pertemuan berikutnya.`:'Belum ada peserta yang menyimpan progres.'}</p></div></section>
<section class="band"><div class="wrap"><div class="stats"><div class="card"><span class="muted small">Peserta</span><b>${n}</b></div><div class="card"><span class="muted small">Lulus & bersertifikat</span><b>${lulus}</b></div><div class="card"><span class="muted small">Rata-rata nilai</span><b>${n?Math.round(rows.reduce((a,r)=>a+(r.rata||0),0)/n):0}</b></div></div>
<div class="grid2" style="margin-top:20px"><div class="card"><h3>Rata-rata kuis per sesi</h3><div class="hbars">${per.map((v,i)=>`<div><span>Sesi ${i+1}</span><div class="bar"><i style="width:${v}%;background:${v<70?'var(--red)':'var(--sea)'}"></i></div><b class="num">${v}</b></div>`).join('')}</div><p class="small muted">Merah: di bawah batas lulus 70.</p></div>
<div class="card"><h3>Ekspor</h3><p class="muted small">Unduh rekap nilai semua peserta sebagai CSV untuk arsip atau laporan.</p><button class="pri" data-act="csv">Unduh rekap (CSV)</button><p class="small muted" id="csvMsg"></p></div></div>
<h3 style="margin-top:24px">Daftar peserta</h3><div class="scroll"><table><thead><tr><th>Nama</th><th>Satuan</th>${[1,2,3,4,5,6].map(k=>`<th class="num">S${k}</th>`).join('')}<th class="num">Sim</th><th class="num">Eval</th><th class="num">Rata</th><th>Status</th><th>Terakhir aktif</th></tr></thead><tbody>
${rows.map(r=>`<tr><td>${esc(r.profil?.nama||profs[r.uid]||'Tanpa nama')}<div class="small muted">${esc(r.profil?.nrp||'')}</div></td><td>${esc(r.profil?.satuan||'')}</td>${[1,2,3,4,5,6].map(k=>{const v=r.kuis?.[k];return `<td class="num" style="color:${v==null?'var(--quiet)':v>=70?'inherit':'var(--red)'}">${v??'–'}</td>`}).join('')}<td class="num">${Object.keys(SIMS).filter(k=>(r.sim?.[k]||0)>=70).length}/3</td><td class="num">${r.akhir??'–'}</td><td class="num">${r.rata??'–'}</td><td>${r.lulus?'<span class="st ok">Lulus</span>':'<span class="st">Proses</span>'}</td><td class="small">${r.updatedAt?new Date(r.updatedAt).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):''}</td></tr>`).join('')||'<tr><td colspan="13" class="muted">Belum ada data.</td></tr>'}</tbody></table></div></div></section>`}

function render(){clearTimers();const h=location.hash.slice(1)||'beranda';nav();let html;
if(h.startsWith('sesi-')&&SES[+h.slice(5)-1])html=vSesi(+h.slice(5));else if(h==='evaluasi')html=vEvaluasi();else if(h==='sertifikat')html=vSertifikat();else if(h==='instruktur')html=vInstruktur();else html=vBeranda();
$('#app').innerHTML=html;if($('#cyc'))startCyc();if($('#fb'))startFlow('fb',FLOW_BAYAR.length);if($('#fr'))startFlow('fr',FLOW_REKON.length);
if($('#certImg')){document.fonts.ready.then(()=>{const i=$('#certImg');if(i)i.src=drawCert().toDataURL('image/png')})}window.scrollTo(0,0)}

document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
if(a==='cplay'){cyc.play=!cyc.play;drawCyc()}if(a==='cnext'){cyc.play=false;goCyc((cyc.i+1)%6)}if(a==='cprev'){cyc.play=false;goCyc((cyc.i+5)%6)}if(a==='cgo'){cyc.play=false;goCyc(+t.dataset.i)}
if(a==='fplay'){const f=flows[t.dataset.f];f.play=!f.play;f.paint()}if(a==='freset'){const f=flows[t.dataset.f];f.i=0;f.play=true;f.paint()}
if(a==='up'||a==='dn'){const i=+t.dataset.i,j=a==='up'?i-1:i+1;if(j<0||j>=URUT.length)return;const u=simState.urut;[u[i],u[j]]=[u[j],u[i]];$('#ord').outerHTML=`<ol class="order" id="ord">${u.map((x,k)=>`<li><span>${x}</span><button data-act="up" data-i="${k}" aria-label="Naikkan ${x}">▲</button><button data-act="dn" data-i="${k}" aria-label="Turunkan ${x}">▼</button></li>`).join('')}</ol>`;document.querySelector(`#ord [data-act=${a}][data-i="${j}"]`)?.focus()}
if(a==='simcek')simCheck(t.dataset.k);
if(a==='retry'){const f=t.closest('form');f.reset();f.querySelectorAll('.opt').forEach(o=>o.classList.remove('right','wrong'));f.querySelectorAll('.expl').forEach(x=>x.remove());t.closest('[id$=-res]').innerHTML='';f.scrollIntoView({behavior:reduce?'auto':'smooth'})}
if(a==='newfin'){finalQs=null;render()}
if(a==='dl'){const m=$('#dlMsg');const d=await use('downloads');if(!d){m.textContent='Unduhan tidak tersedia di tampilan ini. Tekan lama atau klik kanan gambar untuk menyimpannya.';return}
drawCert().toBlob(async b=>{try{await d.save({filename:`Sertifikat-Penganggaran-${S.profil.nama.replace(/[^A-Za-z0-9]+/g,'-').slice(0,40)}.png`,data:b});m.textContent='Sertifikat diunduh.'}catch(err){m.textContent=err?.code==='declined'?'Unduhan dibatalkan.':'Unduhan gagal. Tekan lama atau klik kanan gambar untuk menyimpannya.'}},'image/png')}
if(a==='csv'){const m=$('#csvMsg');const head=['Nama','Pangkat/NRP','Satuan','S1','S2','S3','S4','S5','S6','Sim cocok','Sim urut','Sim rekon','Evaluasi','Rata-rata','Lulus','Terakhir aktif'];
const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const lines=[head.map(q).join(',')].concat(rows.map(r=>[r.profil?.nama||profs[r.uid]||'',r.profil?.nrp,r.profil?.satuan,...[1,2,3,4,5,6].map(k=>r.kuis?.[k]),r.sim?.cocok,r.sim?.urut,r.sim?.rekon,r.akhir,r.rata,r.lulus?'Ya':'Tidak',r.updatedAt?new Date(r.updatedAt).toISOString():''].map(q).join(',')));
const d=await use('downloads');if(!d){m.textContent='Unduhan tidak tersedia di tampilan ini.';return}try{await d.save({filename:'Rekap-Nilai-LMS-Penganggaran-Koarmada-I.csv',data:'﻿'+lines.join('\n')});m.textContent='Rekap diunduh.'}catch(err){m.textContent=err?.code==='declined'?'Unduhan dibatalkan.':'Unduhan gagal.'}}});

document.addEventListener('submit',e=>{const f=e.target.closest('[data-quiz]');if(!f)return;e.preventDefault();const id=f.dataset.quiz;
const qs=id==='fin'?finalQs:SES[+id.slice(1)-1].q;const sc=gradeQuiz(f,qs);
if(id==='fin')S.akhir=best(S.akhir,sc);else S.kuis[+id.slice(1)]=best(S.kuis[+id.slice(1)],sc);save();
const top=id==='fin'?S.akhir:S.kuis[+id.slice(1)];document.getElementById(id+'-res').innerHTML=`<div class="card" style="margin-top:14px"><p><span class="score" style="color:${sc>=70?'var(--ok)':'var(--red)'}">${sc}</span> <span class="muted">/ 100 · nilai terbaik ${top}</span></p><p>${sc>=70?'Lulus. Lanjutkan ke tahap berikutnya.':'Belum lulus. Pelajari pembahasan di atas, lalu coba lagi.'}</p><button type="button" data-act="retry">Coba lagi</button></div>`;
nav()});
document.addEventListener('input',e=>{const p=e.target.dataset.p;if(!p)return;S.profil[p]=e.target.value.slice(0,80);save()});
addEventListener('hashchange',render);
render();

(async()=>{try{user=await use('user');db=await use('db')}catch(e){}
if(!db||!user){return}try{uid=await user.id()}catch(e){}
try{isInstr=!!(await user.canEdit())}catch(e){}
let cw=null;try{cw=await user.can('data.write')}catch(e){}canWrite=!!uid&&cw!==false;
if(uid){const timer=setTimeout(()=>setSync('Sinkron belum tersedia'),10000);try{const snap=await db.doc('progress/'+uid).get();clearTimeout(timer);if(snap.exists)merge(snap.data());setSync(canWrite?'Tersinkron':'Tersimpan di perangkat ini');save();if(canWrite)push()}catch(e){clearTimeout(timer);setSync('Tersimpan di perangkat ini')}}
if(isInstr){unsub=db.collection('progress').onSnapshot(async s=>{rows=s.docs.map(d=>d.data()).filter(Boolean).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
try{const ids=rows.filter(r=>!r.profil?.nama).map(r=>r.uid);if(ids.length){const ps=await user.profiles(ids);for(const id of ids)profs[id]=ps?.[id]?.name||''}}catch(e){}
if(location.hash==='#instruktur')render()},()=>{});}
nav();if((location.hash.slice(1)||'beranda')==='beranda')render()})();
}
</script>
</body>
</html>
